---
- name: Setup GitHub self‑hosted runner and Docker
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    runner_version: "2.327.0"
    runner_url: >-
      https://github.com/actions/runner/releases/download/v{{ runner_version
      }}/actions-runner-linux-x64-{{ runner_version }}.tar.gz
    runner_dir: "/home/ofir/actions-runner"
    repo_url: "https://github.com/ofirgaash1/silence-remover"
    runner_tag: "azure"
    github_pat: "{{ lookup('env','GITHUB_PAT') }}"
    domain: "azure.ofirgaash.click"
    certbot_email: "ofirgaash@gmail.com"
    runner_user: "{{ ansible_user_id }}"
    
  pre_tasks:
    - name: Find old Docker APT source files
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns: "docker*.list*"
        file_type: file
      register: old_docker_lists

    - name: Remove stale Docker APT source files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_docker_lists.files }}"
      when: old_docker_lists.matched > 0

    - name: Remove old Docker keyfile
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.asc
        state: absent

    - name: Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Ensure ACL and apt-related tools are installed
      become: yes
      ansible.builtin.apt:
        name:
          - acl
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
        state: present
        update_cache: yes

    - name: Ensure pip3 is installed
      become: yes
      ansible.builtin.apt:
        name: python3-pip
        state: present

    - name: Ensure Docker SDK for Python is installed
      become: yes
      ansible.builtin.pip:
        name: docker
        executable: pip3

  tasks:
    - name: Ensure user “ofir” exists
      ansible.builtin.user:
        name: ofir
        shell: /bin/bash
        create_home: yes
      tags: [runner]

    - name: Set runner name
      ansible.builtin.set_fact:
        runner_name: "runner-{{ ansible_hostname }}-{{ ansible_host }}"
      tags: [runner]

    - name: Check if runner service unit exists
      ansible.builtin.stat:
        path: "/etc/systemd/system/actions.runner.{{ runner_name }}.service"
      register: runner_svc
      tags: [runner]

    - name: Stop runner service if present
      ansible.builtin.systemd:
        name: "actions.runner.{{ runner_name }}"
        state: stopped
        enabled: no
      when: runner_svc.stat.exists
      tags: [runner]

    - name: Check if runner directory exists
      ansible.builtin.stat:
        path: "{{ runner_dir }}"
      register: runner_dir_stat
      tags: [runner]

    - name: Check if svc.sh exists
      ansible.builtin.stat:
        path: "{{ runner_dir }}/svc.sh"
      register: svc_sh_stat
      tags: [runner]

    - name: Uninstall runner service if present
      ansible.builtin.command:
        cmd: ./svc.sh uninstall
        chdir: "{{ runner_dir }}"
      when:
        - runner_dir_stat.stat.isdir
        - svc_sh_stat.stat.exists
      tags: [runner]

    - name: Remove any stale runner directory
      ansible.builtin.file:
        path: "{{ runner_dir }}"
        state: absent
      tags: [runner]

    - name: Create runner directory
      ansible.builtin.file:
        path: "{{ runner_dir }}"
        state: directory
        owner: ofir
        group: ofir
        mode: "0755"
      tags: [runner]

    - name: Download runner archive
      ansible.builtin.get_url:
        url: "{{ runner_url }}"
        dest: "{{ runner_dir }}/actions-runner.tar.gz"
        mode: "0644"
        force: no

    - name: Check if runner is already extracted
      ansible.builtin.stat:
        path: "{{ runner_dir }}/bin/Runner.Listener"
      register: runner_extracted
      tags: [runner]

    - name: Extract runner
      ansible.builtin.unarchive:
        src: "{{ runner_dir }}/actions-runner.tar.gz"
        dest: "{{ runner_dir }}"
        remote_src: yes
        owner: ofir
        group: ofir
      when: not runner_extracted.stat.exists
      tags: [runner]

    - name: Get GitHub runners list
      ansible.builtin.uri:
        url: "{{ repo_url | regex_replace('https://github.com/', 'https://api.github.com/repos/') }}/actions/runners"
        method: GET
        headers:
          Authorization: "token {{ github_pat }}"
          Accept: "application/vnd.github.v3+json"
        return_content: yes
      register: runners_response
      no_log: true
      tags: [runner]

    - name: Find existing runner in API response
      ansible.builtin.set_fact:
        existing_runner: >-
          {{ runners_response.json.runners
             | selectattr('name','equalto', runner_name)
             | list | first }}
      when: >
        runners_response.json.runners
        | selectattr('name','equalto', runner_name)
        | list | length > 0
      tags: [runner]

    - name: Delete existing runner from GitHub
      ansible.builtin.uri:
        url: "{{ repo_url | regex_replace('https://github.com/', 'https://api.github.com/repos/') }}/actions/runners/{{ existing_runner.id }}"
        method: DELETE
        headers:
          Authorization: "token {{ github_pat }}"
          Accept: "application/vnd.github.v3+json"
        status_code: 204
      when: existing_runner is defined
      no_log: true
      tags: [runner]

    - name: Get GitHub runner registration token
      ansible.builtin.uri:
        url: "{{ repo_url | regex_replace('https://github.com/', 'https://api.github.com/repos/') }}/actions/runners/registration-token"
        method: POST
        headers:
          Authorization: "token {{ github_pat }}"
          Accept: "application/vnd.github.v3+json"
        status_code: 201
        return_content: yes
      register: registration_token_response
      no_log: true
      tags: [runner]

    - name: Set runner_token fact
      ansible.builtin.set_fact:
        runner_token: "{{ registration_token_response.json.token }}"
      tags: [runner]

    - name: Configure GitHub runner (unattended)
      ansible.builtin.command: >
        ./config.sh
        --unattended
        --replace
        --url https://github.com/ofirgaash1/silence-remover
        --token "{{ runner_token }}"
        --name "{{ runner_name }}"
        --labels azure
      args:
        chdir: /home/ofir/actions-runner
      become: no               # <— ensure this runs as the SSH user (ofir)
      become_user: "{{ ansible_user_id }}"


    - name: Install GitHub Actions runner service
      become: yes
      ansible.builtin.command: ./svc.sh install
      args:
        chdir: /home/ofir/actions-runner
        creates: "/etc/systemd/system/actions.runner.ofirgaash1-silence-remover.{{ runner_name }}.service"

    - name: Reload systemd (if we just installed a new unit)
      become: yes
      ansible.builtin.systemd:
        daemon_reload: true
      when: ansible_command_create is defined  # only if install ran

    - name: Ensure GitHub Actions runner service is started & enabled
      become: yes
      ansible.builtin.systemd:
        name: "actions.runner.ofirgaash1-silence-remover.{{ runner_name }}.service"
        state: started
        enabled: true
        
    - name: Start GitHub Actions runner service
      become: yes
      ansible.builtin.command: ./svc.sh start
      args:
        chdir: /home/ofir/actions-runner

    - name: Find GitHub Actions runner service name
      become: yes
      ansible.builtin.shell: |
        systemctl list-units --type=service --no-pager --no-legend | awk '/actions\.runner.*\.service/ {print $1}'
      register: runner_service
      changed_when: false

    - name: Fail if no GitHub Actions runner was found
      ansible.builtin.fail:
        msg: "No GitHub Actions runner service found"
      when: runner_service.stdout == ""

    - name: Restart GitHub Actions runner
      become: yes
      ansible.builtin.systemd:
        name: "{{ runner_service.stdout }}"
        state: restarted
        enabled: true

    - name: Check for existing service file
      ansible.builtin.stat:
        path: "/etc/systemd/system/actions.runner.ofirgaash1-silence-remover.{{ runner_name }}.service"
      register: svc_file
      tags: [runner]

    - name: Install runner service
      become: yes
      ansible.builtin.command: ./svc.sh install
      args:
        chdir: "{{ runner_dir }}"
      when: not svc_file.stat.exists
      tags: [runner]

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: yes
      tags: [runner]

    - name: Discover GitHub runner unit file
      ansible.builtin.find:
        paths: /etc/systemd/system
        patterns: "actions.runner*.service"
      register: runner_units
      tags: [runner]

    - name: Set the runner service name
      ansible.builtin.set_fact:
        runner_service: "{{ runner_units.files[0].path | basename | regex_replace('\\.service$','') }}"
      tags: [runner]

    - name: Start & enable runner service
      ansible.builtin.systemd:
        name: "{{ runner_service }}"
        state: started
        enabled: yes
      tags: [runner]

    - name: Install Docker prerequisites
      apt:
        update_cache: yes
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
      tags: [docker]
      
    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.gpg
        state: present
      tags: [docker]

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_facts.lsb.codename }} stable"
        filename: docker
        update_cache: yes
      tags: [docker]

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: no
      tags: [docker]

    - name: Add “ofir” to docker group
      ansible.builtin.user:
        name: ofir
        groups: docker
        append: yes
      tags: [docker]

    # Ensure Certbot Docker volumes exist
    - name: Create certbot-etc volume
      community.docker.docker_volume:
        name: certbot-etc
      tags: [cert]

    - name: Create certbot-var volume
      community.docker.docker_volume:
        name: certbot-var

    # Stop Traefik (or any HTTP server) so standalone can bind port 80
    - name: Stop Traefik container if it exists
      community.docker.docker_container:
        name: traefik
        state: stopped
      ignore_errors: yes
      tags: [cert]

    # Obtain the cert once
    - name: Obtain TLS cert with certbot (standalone)
      ansible.builtin.command: >
        docker run --rm
          --network host
          -v certbot-etc:/etc/letsencrypt
          -v certbot-var:/var/lib/letsencrypt
          certbot/certbot certonly
            --non-interactive
            --agree-tos
            --no-eff-email
            --standalone
            --preferred-challenges http
            -d "{{ domain }}"
            --email "{{ certbot_email }}"
      args:
        creates: "/var/lib/docker/volumes/certbot-etc/_data/live/{{ domain }}/fullchain.pem"
      become_user: "{{ runner_user }}"
      tags: [cert]

    # Restart Traefik, now with your certs in place
    - name: Start Traefik with Docker Compose
      community.docker.docker_container:
        name: traefik
        state: started
        compose:
          project_src: /path/to/traefik
          files:
            - docker-compose.traefik.yml