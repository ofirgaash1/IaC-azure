- name: Setup GitHub self-hosted runner and Docker
  hosts: all
  become: yes

  vars:
    runner_version: "2.327.0"
    runner_url: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-linux-x64-{{ runner_version }}.tar.gz"
    runner_dir: "/home/ofir/actions-runner"
    repo_url: "https://github.com/ofirgaash1/silence-remover"
    runner_tag: "azure"
    docker_gpg: "/etc/apt/keyrings/docker.asc"
    github_pat: "{{ lookup('env', 'GITHUB_PAT') }}"  # או להעביר עם extra-vars

  tasks:

    - name: Ensure dependencies are installed
      apt:
        name: [curl, ca-certificates]
        state: present
        update_cache: yes

    - name: Get GitHub runner registration token
      uri:
        url: "https://api.github.com/repos/ofirgaash1/silence-remover/actions/runners/registration-token"
        method: POST
        headers:
          Authorization: "token {{ github_pat }}"
          Accept: "application/vnd.github.v3+json"
        status_code: 201
        return_content: yes
      register: registration_token_response

    - name: Set runner_token fact
      set_fact:
        runner_token: "{{ registration_token_response.json.token }}"

    - name: Create runner directory
      file:
        path: "{{ runner_dir }}"
        state: directory
        owner: ofir
        group: ofir
        mode: '0755'

    - name: Download runner archive
      get_url:
        url: "{{ runner_url }}"
        dest: "{{ runner_dir }}/actions-runner.tar.gz"
        mode: '0644'

    - name: Extract runner
      unarchive:
        src: "{{ runner_dir }}/actions-runner.tar.gz"
        dest: "{{ runner_dir }}"
        remote_src: yes
        owner: ofir
        group: ofir

    - name: Configure GitHub runner
      become_user: ofir
      args:
        chdir: "{{ runner_dir }}"
      shell: >
        ./config.sh --url {{ repo_url }} --token {{ runner_token }} --labels {{ runner_tag }} --unattended

    - name: Install runner service
      args:
        chdir: "{{ runner_dir }}"
      shell: ./svc.sh install

    - name: Start runner service
      args:
        chdir: "{{ runner_dir }}"
      shell: ./svc.sh start

    - name: Add Docker GPG key
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o {{ docker_gpg }}
        chmod a+r {{ docker_gpg }}

    - name: Add Docker repository
      apt_repository:
        repo: >
          deb [arch=amd64 signed-by={{ docker_gpg }}] https://download.docker.com/linux/ubuntu
          {{ ansible_facts.lsb.codename }} stable
        state: present
        filename: docker

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Add 'ofir' user to docker group
      user:
        name: ofir
        groups: docker
        append: yes

    - name: Activate new docker group (newgrp docker)
      become_user: ofir
      shell: newgrp docker

    - name: Create Docker volumes for certbot
      shell: |
        docker volume create certbot-etc
        docker volume create certbot-var

    - name: Run certbot container
      become_user: ofir
      shell: |
        docker run -it --rm \
          -v certbot-etc:/etc/letsencrypt \
          -v certbot-var:/var/lib/letsencrypt \
          certbot/certbot \
          certonly --webroot \
          --webroot-path /var/lib/letsencrypt \
          -d azure.ofirgaash.click \
          --email ofirgaash@gmail.com \
          --agree-tos \
          --no-eff-email
