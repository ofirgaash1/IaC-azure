---
- name: Setup GitHub self‑hosted runner and Docker
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    runner_version: "2.327.0"
    runner_url: >-
      https://github.com/actions/runner/releases/download/v{{ runner_version
      }}/actions-runner-linux-x64-{{ runner_version }}.tar.gz
    runner_dir: "/home/ofir/actions-runner"
    repo_url: "https://github.com/ofirgaash1/silence-remover"
    runner_tag: "azure"
    github_pat: "{{ lookup('env','GITHUB_PAT') }}"

  pre_tasks:
    - name: Find old Docker APT source files
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns: "docker*.list*"
        file_type: file
      register: old_docker_lists

    - name: Remove stale Docker APT source files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_docker_lists.files }}"
      when: old_docker_lists.matched > 0

    - name: Remove old Docker keyfile
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.asc
        state: absent

    - name: Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Ensure ACL and apt-related tools are installed
      become: yes
      ansible.builtin.apt:
        name:
          - acl
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
        state: present
        update_cache: yes

    - name: Ensure pip3 is installed
      become: yes
      ansible.builtin.apt:
        name: python3-pip
        state: present

    - name: Ensure Docker SDK for Python is installed
      become: yes
      ansible.builtin.pip:
        name: docker
        executable: pip3


  tasks:
    - name: Ensure user “ofir” exists
      ansible.builtin.user:
        name: ofir
        shell: /bin/bash
        create_home: yes
      tags: [runner]

    - name: Set runner name
      ansible.builtin.set_fact:
        runner_name: "runner-{{ ansible_hostname }}-{{ ansible_host }}"
      tags: [runner]

    - name: Stop runner service if present
      ansible.builtin.systemd:
        name: actions.runner.{{ runner_name }}
        state: stopped
        enabled: no
      ignore_errors: yes
      tags: [runner]

    - name: Uninstall runner service if present
      ansible.builtin.command:
        cmd: ./svc.sh uninstall
        chdir: "{{ runner_dir }}"
      ignore_errors: yes
      tags: [runner]

    - name: Remove any stale runner directory
      ansible.builtin.file:
        path: "{{ runner_dir }}"
        state: absent
      tags: [runner]

    - name: Create runner directory
      ansible.builtin.file:
        path: "{{ runner_dir }}"
        state: directory
        owner: ofir
        group: ofir
        mode: '0755'
      tags: [runner]

    - name: Download runner archive
      ansible.builtin.get_url:
        url: "{{ runner_url }}"
        dest: "{{ runner_dir }}/actions-runner.tar.gz"
        mode: '0644'
      tags: [runner]

    - name: Extract runner
      ansible.builtin.unarchive:
        src: "{{ runner_dir }}/actions-runner.tar.gz"
        dest: "{{ runner_dir }}"
        remote_src: yes
        owner: ofir
        group: ofir
      tags: [runner]

    - name: Get GitHub runners list
      ansible.builtin.uri:
        url: "{{ repo_url | regex_replace('https://github.com/', 'https://api.github.com/repos/') }}/actions/runners"
        method: GET
        headers:
          Authorization: "token {{ github_pat }}"
          Accept: "application/vnd.github.v3+json"
        return_content: yes
      register: runners_response
      no_log: true
      tags: [runner]

    - name: Find existing runner in API response
      ansible.builtin.set_fact:
        existing_runner: >-
          {{ runners_response.json.runners
             | selectattr('name','equalto', runner_name)
             | list | first }}
      when: >
        runners_response.json.runners
        | selectattr('name','equalto', runner_name)
        | list | length > 0
      tags: [runner]

    - name: Delete existing runner from GitHub
      ansible.builtin.uri:
        url: "{{ repo_url | regex_replace('https://github.com/', 'https://api.github.com/repos/') }}/actions/runners/{{ existing_runner.id }}"
        method: DELETE
        headers:
          Authorization: "token {{ github_pat }}"
          Accept: "application/vnd.github.v3+json"
        status_code: 204
      when: existing_runner is defined
      no_log: true
      tags: [runner]

    - name: Get GitHub runner registration token
      ansible.builtin.uri:
        url: "{{ repo_url | regex_replace('https://github.com/', 'https://api.github.com/repos/') }}/actions/runners/registration-token"
        method: POST
        headers:
          Authorization: "token {{ github_pat }}"
          Accept: "application/vnd.github.v3+json"
        status_code: 201
        return_content: yes
      register: registration_token_response
      no_log: true
      tags: [runner]

    - name: Set runner_token fact
      ansible.builtin.set_fact:
        runner_token: "{{ registration_token_response.json.token }}"
      tags: [runner]

    - name: Configure GitHub runner (unattended)
      ansible.builtin.command: >
        {{ runner_dir }}/config.sh
        --unattended --replace
        --url {{ repo_url }}
        --token {{ runner_token }}
        --name {{ runner_name }}
        --labels {{ runner_tag }}
      args:
        chdir: "{{ runner_dir }}"
        creates: "{{ runner_dir }}/.runner"
      become_user: ofir
      tags: [runner]
      notify: Restart runner service

    - name: Install runner service
      ansible.builtin.command:
        cmd: ./svc.sh install
        chdir: "{{ runner_dir }}"
      tags: [runner]

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: yes
      tags: [runner]

    - name: Discover GitHub runner unit file
      ansible.builtin.find:
        paths: /etc/systemd/system
        patterns: "actions.runner*.service"
      register: runner_units
      tags: [runner]

    - name: Set the runner service name
      ansible.builtin.set_fact:
        runner_service: "{{ runner_units.files[0].path | basename | regex_replace('\\.service$','') }}"
      tags: [runner]

    - name: Start & enable runner service
      ansible.builtin.systemd:
        name: "{{ runner_service }}"
        state: started
        enabled: yes
      tags: [runner]

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.gpg
        state: present
      tags: [docker]

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_facts.lsb.codename }} stable"
        filename: docker
        update_cache: yes
      tags: [docker]

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: no
      tags: [docker]

    - name: Add “ofir” to docker group
      ansible.builtin.user:
        name: ofir
        groups: docker
        append: yes
      tags: [docker]

    - name: Create certbot Docker volumes
      community.docker.docker_volume:
        name: "{{ item }}"
        state: present
      loop:
        - certbot-etc
        - certbot-var
      tags: [docker, certbot]

    - name: Obtain TLS cert with certbot
      ansible.builtin.command: >
        docker run --rm
        -v certbot-etc:/etc/letsencrypt
        -v certbot-var:/var/lib/letsencrypt
        certbot/certbot certonly
        --non-interactive
        --agree-tos
        --no-eff-email
        --webroot
        --webroot-path /var/lib/letsencrypt
        -d azure.ofirgaash.click
        --email ofirgaash@gmail.com
      args:
        creates: "/var/lib/docker/volumes/certbot-etc/_data/live/azure.ofirgaash.click/fullchain.pem"
      become_user: ofir
      tags: [certbot]

  handlers:
    - name: Restart runner service
      ansible.builtin.systemd:
        name: actions.runner.{{ runner_name }}
        state: restarted
        enabled: yes
