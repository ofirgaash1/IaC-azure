- name: Setup GitHub self‑hosted runner and Docker
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    runner_version: "2.327.0"
    runner_url: >-
      https://github.com/actions/runner/releases/download/v{{ runner_version
      }}/actions-runner-linux-x64-{{ runner_version }}.tar.gz
    runner_dir: "/home/ofir/actions-runner"
    repo_url: "https://github.com/ofirgaash1/silence-remover"
    runner_tag: "azure"
    docker_gpg: "/etc/apt/keyrings/docker.gpg"
    github_pat: "{{ lookup('env', 'GITHUB_PAT') }}"

  tasks:

    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    # 1. Ensure the "ofir" user exists (home, shell)                         #
    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    - name: Ensure user “ofir” exists
      user:
        name: ofir
        shell: /bin/bash
        create_home: yes

    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    # 2. Compute unique runner_name                                          #
    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    - name: Set runner name
      set_fact:
        runner_name: "runner-{{ ansible_hostname }}-{{ ansible_host }}"

    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    # 3. Unregister & clean up any existing runner installation              #
    #    (non‑interactive removal, stop+uninstall service, remove directory) #
    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    - name: Remove existing GitHub Actions runner (non‑interactive)
      become_user: ofir
      args:
        chdir: "{{ runner_dir }}"
      shell: >
        ./config.sh remove
          --url {{ repo_url }}
          --name {{ runner_name }}
          --unattended
      ignore_errors: yes

    - name: Stop runner service (if exists)
      args:
        chdir: "{{ runner_dir }}"
      shell: ./svc.sh stop
      ignore_errors: yes

    - name: Uninstall runner service (if exists)
      args:
        chdir: "{{ runner_dir }}"
      shell: ./svc.sh uninstall
      ignore_errors: yes

    - name: Remove any stale runner directory
      file:
        path: "{{ runner_dir }}"
        state: absent
      ignore_errors: yes

    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    # 4. Ensure apt prerequisites (for runner + Docker repo)                #
    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    - name: Ensure apt prerequisites are installed
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
        state: present
        update_cache: yes

    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    # 5. Create clean runner directory                                       #
    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    - name: Create runner directory
      file:
        path: "{{ runner_dir }}"
        state: directory
        owner: ofir
        group: ofir
        mode: '0755'

    - name: Download runner archive
      get_url:
        url: "{{ runner_url }}"
        dest: "{{ runner_dir }}/actions-runner.tar.gz"
        mode: '0644'

    - name: Extract runner
      unarchive:
        src: "{{ runner_dir }}/actions-runner.tar.gz"
        dest: "{{ runner_dir }}"
        remote_src: yes
        owner: ofir
        group: ofir

    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    # 6. Register & start the GitHub Actions runner                          #
    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    - name: Get GitHub runners list
      uri:
        url: "{{ repo_url | regex_replace('https://github.com/', 'https://api.github.com/repos/') }}/actions/runners"
        method: GET
        headers:
          Authorization: "token {{ github_pat }}"
          Accept: "application/vnd.github.v3+json"
        return_content: yes
      register: runners_response

    - name: Find existing runner in API response
      set_fact:
        existing_runner: >-
          {{ runners_response.json.runners
             | selectattr('name','equalto', runner_name)
             | list | first }}
      when: runners_response.json.runners
            | selectattr('name','equalto', runner_name)
            | list | length > 0

    - name: Delete existing runner from GitHub (API)
      uri:
        url: "{{ repo_url | regex_replace('https://github.com/', 'https://api.github.com/repos/') }}/actions/runners/{{ existing_runner.id }}"
        method: DELETE
        headers:
          Authorization: "token {{ github_pat }}"
          Accept: "application/vnd.github.v3+json"
        status_code: 204
      when: existing_runner is defined

    - name: Get GitHub runner registration token
      uri:
        url: "{{ repo_url | regex_replace('https://github.com/', 'https://api.github.com/repos/') }}/actions/runners/registration-token"
        method: POST
        headers:
          Authorization: "token {{ github_pat }}"
          Accept: "application/vnd.github.v3+json"
        status_code: 201
        return_content: yes
      register: registration_token_response

    - name: Set runner_token fact
      set_fact:
        runner_token: "{{ registration_token_response.json.token }}"

    - name: Configure GitHub runner (unattended)
      become_user: ofir
      args:
        chdir: "{{ runner_dir }}"
      shell: >
        ./config.sh
          --url {{ repo_url }}
          --token {{ runner_token }}
          --labels {{ runner_tag }}
          --name {{ runner_name }}
          --unattended

    - name: Install runner service
      args:
        chdir: "{{ runner_dir }}"
      shell: ./svc.sh install

    - name: Start runner service
      args:
        chdir: "{{ runner_dir }}"
      shell: ./svc.sh start

    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    # 7. Add Docker repository and install Docker CE                        #
    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    - name: Ensure /etc/apt/keyrings exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: "{{ docker_gpg }}"
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by={{ docker_gpg }}] https://download.docker.com/linux/ubuntu {{ ansible_facts.lsb.codename }} stable"
        filename: docker
        update_cache: yes

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Add “ofir” to docker group
      user:
        name: ofir
        groups: docker
        append: yes

    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    # 8. Create certbot volumes & obtain TLS certificate                   #
    #––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––––#
    - name: Create certbot Docker volumes
      community.docker.docker_volume:
        name: "{{ item }}"
        state: present
      loop:
        - certbot-etc
        - certbot-var

    - name: Obtain TLS cert with certbot
      become_user: ofir
      shell: |
        docker run --rm \
          -v certbot-etc:/etc/letsencrypt \
          -v certbot-var:/var/lib/letsencrypt \
          certbot/certbot certonly \
            --non-interactive \
            --webroot \
            --webroot-path /var/lib/letsencrypt \
            -d azure.ofirgaash.click \
            --email ofirgaash@gmail.com \
            --agree-tos \
            --no-eff-email
      args:
        creates: "/var/lib/docker/volumes/certbot-etc/_data/live/azure.ofirgaash.click/fullchain.pem"
