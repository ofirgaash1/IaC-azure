name: 'Deploy One-Time'

trigger:
  - function-related-infra

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'OfirRG-Service-Connection'
  resourceGroupName: 'Ofir-RG'
  location: 'eastus'

stages:
- stage: DeployOneTimeResources
  displayName: Deploy One-Time Resources
  jobs:

  - job: DeployStorageAccount
    displayName: Deploy Table Storage
    steps:
    - task: AzureResourceManagerTemplateDeployment@3
      displayName: Deploy table-template
      inputs:
        deploymentScope: 'Resource Group'
        azureResourceManagerConnection: '$(azureServiceConnection)'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(resourceGroupName)'
        location: '$(location)'
        templateLocation: 'Linked artifact'
        csmFile: 'one-time/table-template.json'
        csmParametersFile: 'one-time/table-parameters.json'
        deploymentMode: 'Incremental'

    - task: AzureCLI@2
      displayName: Create Table in Storage Account
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az storage table create \
            --name PageHits \
            --account-name ofirgaash \
            --auth-mode login

  - job: DeployLogAnalytics
    displayName: Deploy Log Analytics
    dependsOn: DeployStorageAccount
    steps:
    - task: AzureResourceManagerTemplateDeployment@3
      displayName: Deploy Log Analytics + App Insights
      inputs:
        deploymentScope: 'Resource Group'
        azureResourceManagerConnection: '$(azureServiceConnection)'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(resourceGroupName)'
        location: '$(location)'
        templateLocation: 'Linked artifact'
        csmFile: 'one-time/log-template.json'
        csmParametersFile: 'one-time/log-parameters.json'
        deploymentMode: 'Incremental'

  - job: DeployFunctionApp
    displayName: Deploy Function App
    dependsOn:
      - DeployStorageAccount
      - DeployLogAnalytics
    steps:
    - task: AzureResourceManagerTemplateDeployment@3
      displayName: Deploy func-template
      inputs:
        deploymentScope: 'Resource Group'
        azureResourceManagerConnection: '$(azureServiceConnection)'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(resourceGroupName)'
        location: '$(location)'
        templateLocation: 'Linked artifact'
        csmFile: 'one-time/func-template.json'
        csmParametersFile: 'one-time/func-parameters.json'
        deploymentMode: 'Incremental'
